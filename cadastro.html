<!DOCTYPE html>
<!-- lang="pt-BR" ajuda leitores de tela a pronunciar o texto corretamente -->
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <!-- Necessário para a página ficar responsiva no celular -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cadastro | Site 1</title>

  <!-- Fonte Lexend (Google Fonts). Se não carregar, o CSS usa uma fonte do sistema -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="cadastro.css">
</head>
<body>

  <!-- Link para quem navega só pelo teclado pular direto ao formulário -->
  <a class="pular-menu" href="#conteudo">Ir para o formulário</a>

  <!-- CABEÇALHO: logo + menu de navegação -->
  <header class="topo">
    <div class="topo__conteudo">
      <!-- Imagem com texto alternativo (alt). Troque pelo seu logo. -->
      <img class="logo"
          rc="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'><rect width='48' height='48' rx='10' fill='%230B5563'/><path d='M14 32V16h6l4 8 4-8h6v16h-5V24l-3 6h-4l-3-6v8z' fill='white'/></svg>"
          alt="Logotipo do Site 1" width="40" height="40">

      <nav aria-label="Menu principal">
        <ul class="menu">
          <li><a href="index.html">Início</a></li>
          <li><a href="sobre.html">Sobre</a></li>
          <li><a href="cadastro.html" aria-current="page">Cadastro</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- CONTEÚDO PRINCIPAL: só existe um <main> por página -->
  <main id="conteudo">
    <section class="cadastro" aria-labelledby="titulo-cadastro">

      <!-- Título e texto de apoio: primeiro nível da hierarquia visual -->
      <h1 id="titulo-cadastro">Crie seu cadastro</h1>
      <p class="apoio">Leva menos de um minuto. Os campos com <span class="obrigatorio-marca" aria-hidden="true">*</span> são obrigatórios.</p>

      <!-- FORMULÁRIO -->
      <form action="#" method="post">

        <!-- fieldset agrupa campos relacionados; legend dá nome ao grupo -->
        <fieldset>
          <legend>Seus dados</legend>

          <!-- Cada label se liga ao campo pelo par for="..." / id="..." -->
          <div class="campo">
            <label for="nome">Nome completo <span class="obrigatorio-marca" aria-hidden="true">*</span></label>
            <input type="text" id="nome" name="nome" autocomplete="name" required>
          </div>

          <div class="campo">
            <label for="email">E-mail <span class="obrigatorio-marca" aria-hidden="true">*</span></label>
            <input type="email" id="email" name="email" autocomplete="email"
                placeholder="nome@exemplo.com" required>
          </div>

          <div class="campo">
            <label for="telefone">Telefone <span class="obrigatorio-marca" aria-hidden="true">*</span></label>
            <input type="tel" id="telefone" name="telefone" autocomplete="tel"
            placeholder="(49) 99999-9999" required>
          </div>

          <div class="campo">
            <label for="bairro">Bairro <span class="obrigatorio-marca" aria-hidden="true">*</span></label>
            <input type="text" id="bairro" name="bairro" required>
          </div>
        </fieldset>

        <!-- Botão de envio com destaque (estilo no CSS) -->
        <button type="submit" class="botao">Criar cadastro</button>
      </form>
    </section>
  </main>

  <!-- RODAPÉ -->
  <footer class="rodape">
    <p>&copy; 2026 Site 1. Todos os direitos reservados.</p>
  </footer>

</body>
</html>
